workflows:
  android-native:
    name: WASEEM MEDICAL PRO - Android
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Verify native Android project
        script: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test ! -f pubspec.yaml || { echo "ERROR: Flutter configuration detected unexpectedly"; exit 1; }
      - name: Build Android APK
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
