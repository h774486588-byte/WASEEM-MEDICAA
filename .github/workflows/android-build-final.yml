name: WASEEM Medical PRO - Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile, Test and Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source manually
        shell: bash
        run: |
          set -euxo pipefail
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD

      - name: Prepare Android SDK and Java
        shell: bash
        run: |
          set -euxo pipefail
          export JAVA_HOME="/usr/lib/jvm/temurin-17-jdk-amd64"
          export PATH="$JAVA_HOME/bin:${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:$PATH"
          java -version
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp
          test -x /tmp/gradle-9.3.1/bin/gradle
          /tmp/gradle-9.3.1/bin/gradle --version

      - name: Verify project
        shell: bash
        run: |
          set -euxo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle.properties
          test -d app/src/main

      - name: Run unit tests
        shell: bash
        run: |
          set -euxo pipefail
          export JAVA_HOME="/usr/lib/jvm/temurin-17-jdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"
          /tmp/gradle-9.3.1/bin/gradle test --stacktrace --no-daemon --no-configuration-cache

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euxo pipefail
          export JAVA_HOME="/usr/lib/jvm/temurin-17-jdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"
          /tmp/gradle-9.3.1/bin/gradle :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Publish APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TAG="v1.0.0-build.${{ github.run_number }}"
          TITLE="نظام وسيم الطبي PRO - ${{ github.run_number }}"
          NOTES="نسخة APK قابلة للتثبيت من نظام وسيم الطبي PRO.
          Commit: ${{ github.sha }}
          النوع: Debug APK
          تم اجتياز اختبارات الوحدة والبناء في GitHub Actions."
          gh --version
          gh release create "$TAG" "$APK"             --repo "${{ github.repository }}"             --title "$TITLE"             --notes "$NOTES"

      - name: Write build summary
        shell: bash
        run: |
          echo "### WASEEM MEDICAL PRO" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: Debug" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v1.0.0-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
