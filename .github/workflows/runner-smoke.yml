name: Runner Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke test
        run: |
          set -euxo pipefail
          echo "GitHub Actions runner is available"
          uname -a
          java -version || true
