name: Build WASEEM MEDICAL PRO

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts || test -f settings.gradle
          test -d app
          echo "Android project detected."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle assembleDebug --stacktrace --no-daemon

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WASEEM-MEDICAL-PRO-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
