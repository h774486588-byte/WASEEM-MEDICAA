name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner preflight
        run: |
          set -euxo pipefail
          echo "Runner preflight OK"
          uname -a
          java -version
