name: Build WASEEM MEDICAL PRO

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts || test -f settings.gradle
          test -d app
          echo "Android project detected."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ./gradlew ]; then
            echo "gradlew is missing from the repository."
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WASEEM-MEDICAL-PRO-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
