name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source manually
        shell: bash
        run: |
          set -euxo pipefail
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:$PATH" || true
          command -v sdkmanager || true
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platform-tools" >/dev/null 2>&1 || true
          fi

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1-bin.zip
          rm -rf /tmp/gradle-9.3.1
          mkdir -p /tmp/gradle-9.3.1
          unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp
          test -x /tmp/gradle-9.3.1/bin/gradle
          /tmp/gradle-9.3.1/bin/gradle --version

      - name: Verify source
        shell: bash
        run: |
          set -euxo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src/main

      - name: Build tests and debug APK
        shell: bash
        run: |
          set -euxo pipefail
          export JAVA_HOME="/usr/lib/jvm/temurin-17-jdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"
          /tmp/gradle-9.3.1/bin/gradle test :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        shell: bash
        run: |
          set -euxo pipefail
          ls -lah app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
